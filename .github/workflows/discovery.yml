{"name": "Buscar, anonimizar y solicitar revisión", "permissions": {"contents": "read"}, "jobs": {"sentencias-recientes": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"uses": "actions/setup-node@v4", "with": {"node-version": "22"}}, {"run": "pip install --requirement requirements-automation.txt"}, {"run": "npm install", "working-directory": "worker"}, {"name": "Anonimizar las sentencias subidas manualmente", "run": "python tools/process_manual_uploads.py --out data/discovery-output/manual.json", "env": {"CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}", "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}}, {"name": "Avisar de subidas manuales listas para revisar", "run": "python tools/notify_review.py data/discovery-output/manual.json", "env": {"SMTP_USERNAME": "${{ secrets.SMTP_USERNAME }}", "SMTP_APP_PASSWORD": "${{ secrets.SMTP_APP_PASSWORD }}", "REVIEW_EMAIL": "${{ secrets.REVIEW_EMAIL }}", "PUBLIC_APP_URL": "${{ secrets.PUBLIC_APP_URL }}"}}, {"name": "Reanonimizar las candidatas devueltas por Karol", "run": "python tools/reprocess_requested.py --out data/discovery-output/reprocessed.json", "env": {"CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}", "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}}, {"name": "Avisar de copias reanonimizadas", "run": "python tools/notify_review.py data/discovery-output/reprocessed.json", "env": {"SMTP_USERNAME": "${{ secrets.SMTP_USERNAME }}", "SMTP_APP_PASSWORD": "${{ secrets.SMTP_APP_PASSWORD }}", "REVIEW_EMAIL": "${{ secrets.REVIEW_EMAIL }}", "PUBLIC_APP_URL": "${{ secrets.PUBLIC_APP_URL }}"}}, {"run": "python tools/discover_recent.py --out data/discovery-output/recent.json --days 14"}, {"run": "python tools/anonymize_candidates.py data/discovery-output/recent.json --out data/discovery-output/prepared"}, {"name": "Sincronizar únicamente candidatas nuevas", "run": "python tools/sync_review_candidates.py data/discovery-output/prepared/prepared.json --new-out data/discovery-output/new.json", "env": {"CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}", "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}}, {"name": "Avisar a la administradora", "run": "python tools/notify_review.py data/discovery-output/new.json", "env": {"SMTP_USERNAME": "${{ secrets.SMTP_USERNAME }}", "SMTP_APP_PASSWORD": "${{ secrets.SMTP_APP_PASSWORD }}", "REVIEW_EMAIL": "${{ secrets.REVIEW_EMAIL }}", "PUBLIC_APP_URL": "${{ secrets.PUBLIC_APP_URL }}"}}, {"name": "Conservar informe técnico", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "informe-sentencias-recientes", "path": "data/discovery-output", "retention-days": 14}}]}}, "on": {"schedule": [{"cron": "17 5 * * *"}], "workflow_dispatch": null}}
